server_tokens               off;
access_log                  /var/log/nginx/ivanbuilds.access.log;
error_log                   /var/log/nginx/ivanbuilds.error.log;

# HTTP: Редирект на HTTPS и ACME-челлендж
server {
    listen 80;
    server_name ivanbuilds.tech www.ivanbuilds.tech;

    location /.well-known/acme-challenge/ { 
        root /var/www/certbot; 
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Определение апстрима для Next.js
upstream nextjs_upstream {
    server nextjs:3000;
}

# HTTPS: Основной сервер
server {
    listen 443 ssl;
    server_name ivanbuilds.tech www.ivanbuilds.tech;

    # SSL настройки (Пути Certbot)
    ssl_certificate /etc/letsencrypt/live/ivanbuilds.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ivanbuilds.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Защита от левых хостов
    if ( $host !~* ^(ivanbuilds.tech|www.ivanbuilds.tech)$ ) {
        return 444;
    }

    # Проксирование всего трафика на Next.js App Router
    location / {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Next.js оптимизация для статики (опционально, т.к. Next сам справляется)
    location /_next/static/ {
        proxy_pass http://nextjs_upstream;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
